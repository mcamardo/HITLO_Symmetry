Subject:
  id: P062
  session: S001
  base_dir: /Users/maccamardo/HITLO_Data

Cost:
  aim: Aim 1
  sample_rate: 200
  time: 90
  signed: true
  si_target: -3.0
  trim_seconds: 3.0

Optimization:
  # The search space is now the index table, not a box of bounds.
  # Every reachable configuration is a row of this file, pre-validated by
  # build_index_unified.m. Regenerate the CSV to change caps or filters.
  index_csv: config/index_unified.csv

  n_parms: 1
  range:
  - - -1.0
  - - 1.0

  n_steps: 15
  manual_ramp_trials: 5

  # x values, snapped to real rows at load. Two DF, zero, two PF: the ramp
  # has to touch both arms or the GP starts blind on one side.
  ramp_sequence:
  - 0.0
  - 0.2
  - -0.2
  - 0.4
  - -0.4

  device: cpu
  normalize: true
  acquisition: ei
  kernel_function: se
  model_save_path: auto
  result_save_path: auto

Parameters:
  x:
    name: Unified Stiffness Index
    unit: dimensionless
    description: >
      -1 = max dorsiflexor stiffness, 0 = zero torque, +1 = max plantarflexor.
      Maps to (R, theta, L0, attachment_ratio) via index_unified.csv.
      x = 0 is not device-off: the bands are always on and must be cancelled.