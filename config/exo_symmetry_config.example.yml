# =============================================================================
# HITLO_Symmetry — experiment configuration (EXAMPLE / TEMPLATE)
#
# Copy to exo_symmetry_config.yml and edit, or use the Setup page in the
# console (streamlit run apps/hitlo_console.py), which writes this file for you.
#
# v3.0.0 — unified index parameterization.
#
# WHAT IS NOT IN THIS FILE, AND WHY
# Torque caps, engagement filters, and the parameter bounds are NOT here. They
# live in build_index_unified.m, which sweeps the four physical parameters,
# filters for safety and torque shape, and writes index_unified.csv. Every
# configuration BO can reach is a row of that file and was validated at build
# time.
#
# That means: to change a safety limit or widen the search space, edit the
# MATLAB builder and regenerate the CSV. Do not add limits back here. Two
# places holding the same limit is how they end up disagreeing — the previous
# version had a PF cap of 60 in this file while the code enforced 90.
# =============================================================================

Subject:
  id: P001
  session: S001
  # Root of the BIDS-ish data tree. Trials are read from and written to
  # <base_dir>/sub-<id>/ses-<session>/eeg/
  base_dir: ~/HITLO_Data

Sensing:
  # Which hardware produced the recording, and how to find heel strikes in it.
  #
  #   backend   polar    two LSL streams ('polar accel left'/'right'),
  #                      accelerometer only, ~200 Hz
  #             trigno   ONE stream carrying both sides, accel AND gyro,
  #                      side encoded in the channel labels, ~148 Hz
  #
  #   detector  accel    jerk peaks + clustering (hitlo/detection.py)
  #             gyro     swing peak -> negative zero crossing
  #                      (hitlo/detection_gyro.py)
  #
  # detector defaults per backend (polar->accel, trigno->gyro), so a config
  # without this block behaves exactly as it did before the block existed.
  #
  # The two detectors find DIFFERENT INSTANTS -- the gyro zero crossing is
  # initial contact, the jerk peak is the impact shock after it. A baseline
  # collected with one must not be carried into a session run with the other.
  # apps/compare_detectors.py measures the difference on your own recording.
  #
  # WHY trigno + gyro IS THE DEFAULT. At 148 Hz the accelerometer's
  # heel-strike impact spans about 2 samples and its peak amplitude varies
  # ~25% stride to stride, so a soft strike can drop below threshold and be
  # missed -- measured on sub-P012, the accel path missed 9 strides in one
  # trial that the gyro found. The gyro's mid-swing feature spans about 39
  # samples with ~10% amplitude variation: roughly 20x better resolved by the
  # same hardware. On a known manipulation (a deliberate limp) the gyro got
  # both directions right while the accelerometer reported the wrong leg.
  #
  # Set backend: polar for the Polar H10 path, which has no gyroscope and so
  # must use the accelerometer. It is kept working and tested.
  backend: trigno
  detector: gyro
  stream: TrignoIMU        # only used when backend is trigno

Cost:
  # Aim 1 = neurotypical, induce a target asymmetry relative to the subject's
  #         own baseline (a baseline phase runs first and overrides si_target).
  # Aim 2 = stroke, drive toward symmetry (si_target fixed at 0, no baseline).
  aim: Aim 1

  sample_rate: 200        # Hz, Polar H10 accelerometer
  time: 90                # trial duration in seconds

  # signed=true requires TWO shank sensors. With one sternum sensor the sign
  # of the symmetry index is unreliable, so a nonzero si_target is meaningless.
  signed: true

  # Target symmetry index in percent. For Aim 1 this is only a fallback: the
  # baseline phase computes si_target = baseline_si + sign(baseline_si)*displacement and
  # overwrites it. For Aim 2 it is forced to 0.
  si_target: -3.0

  # Seconds trimmed from each end of a trial before analysis, to keep the
  # measurement in steady-state walking.
  trim_seconds: 3.0

Optimization:
  # ---------------------------------------------------------------------
  # The search space. BO optimizes ONE number, x in [-1, +1]:
  #     x = -1   max dorsiflexor stiffness (limited by the 24-band ceiling)
  #     x =  0   zero torque
  #     x = +1   max plantarflexor stiffness (limited by the torque cap)
  # Each x resolves through this CSV into (R, theta, L0, attachment_ratio),
  # the four values the operator sets on the device.
  #
  # x is NOT uniformly spaced: the two arms get different level counts, so DF
  # steps are wider than PF steps. Code matches on nearest value in the x
  # column and never computes a position arithmetically.
  # ---------------------------------------------------------------------
  index_csv: config/index_unified.csv

  # Structural, not really tunable. One parameter, fixed range.
  n_parms: 1
  range:
  - - -1.0
  - - 1.0

  n_steps: 15             # total trials, including the ramp
  manual_ramp_trials: 5   # trials 1-N come from ramp_sequence; BO runs after

  # Ramp x values, snapped to real table rows at load. These must SPAN the
  # range, not cluster near zero. Two failure modes if they do not:
  #   - every ramp trial on one arm leaves the GP with no data on the other,
  #     and with ~10 BO trials it may never go look;
  #   - a ramp bunched near x=0 samples only a narrow band of torque, so the
  #     GP's length scale is fitted on a range the experiment then leaves.
  # tests/test_regression.py::test_ramp_spans_the_torque_range enforces this.
  ramp_sequence:
  - -1.0                  # max dorsiflexor assist
  - 0.0                   # zero torque
  - 0.3
  - 0.6333333333333333
  - 1.0                   # max plantarflexor assist

  device: cpu
  normalize: true         # map x to [0,1] for GP numerical stability
  acquisition: ei
  kernel_function: se

  # 'auto' means the console fills these in under
  # <base_dir>/sub-<id>/ses-<session>/derivatives/hil_optimization/
  model_save_path: auto
  result_save_path: auto

Parameters:
  x:
    name: Unified Stiffness Index
    unit: dimensionless
    description: >
      -1 = max dorsiflexor stiffness, 0 = zero torque, +1 = max plantarflexor.
      Ordered on effective rotational stiffness (dtau/dtheta over the traversed
      ROM), which anchors the search space to Collins/Wiggin/Sawicki 2015
      (~180 Nm/rad). Maps to (R, theta, L0, attachment_ratio) via index_csv.

      x = 0 is NOT device-off. The 24 rubber bands are always on, so the
      controller must actively cancel them: tau_cable = 0 - tau_band(theta).
      On the DF arm generally, the controller renders the target curve as
      tau_cable = tau_desired - tau_band(theta).
